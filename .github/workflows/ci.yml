name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          # Dev tools come from PEP 735 [dependency-groups] in pyproject.toml.
          pip install --group dev

      - name: Lint gate (pre-commit)
        # Single source of truth: same hooks as local dev (`.pre-commit-config.yaml`),
        # all `language: system` (black/flake8/mypy/import-linter), tools installed
        # above via `--group dev`. `--all-files` = whole repo, no staged-only bias.
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Audit report (cohesion, vulture)
        # Report-only on purpose: informational signals, never fail the build.
        # vulture --ignore-names cls silences false positives on classmethod params.
        run: |
          cohesion -d src || true
          vulture src/ --min-confidence 70 --ignore-names cls || true

      - name: Tests + coverage report
        # Tests are a hard gate; the coverage table is informational only
        # (no --cov-fail-under, so uncovered lines never fail the build).
        run: python3 -m pytest tests/ --cov=src --cov-report=term-missing


  maelstrom-echo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip
          pip install --group test

      - name: Set up Java 17 (for Maelstrom)
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install gnuplot (Maelstrom needs it for plots)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnuplot

      - name: Install Maelstrom v0.2.4
        run: |
          sudo mkdir -p /opt/maelstrom
          sudo curl -fL -o /tmp/maelstrom.tar.bz2 \
            https://github.com/jepsen-io/maelstrom/releases/download/v0.2.4/maelstrom.tar.bz2
          sudo tar -xjf /tmp/maelstrom.tar.bz2 -C /opt/maelstrom --strip-components=1
          sudo rm /tmp/maelstrom.tar.bz2
          echo "/opt/maelstrom" >> "$GITHUB_PATH"

      - name: Run Maelstrom echo test
        run: |
          maelstrom test \
            -w echo \
            --bin "src/main.py" \
            --node-count 1 \
            --time-limit 10 \
            --rate 1 \
            --log-stderr
        working-directory: ${{ github.workspace }}


  maelstrom-uniqueids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip
          pip install --group test

      - name: Set up Java 17 (for Maelstrom)
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install gnuplot (Maelstrom needs it for plots)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnuplot

      - name: Install Maelstrom v0.2.4
        run: |
          sudo mkdir -p /opt/maelstrom
          sudo curl -fL -o /tmp/maelstrom.tar.bz2 \
            https://github.com/jepsen-io/maelstrom/releases/download/v0.2.4/maelstrom.tar.bz2
          sudo tar -xjf /tmp/maelstrom.tar.bz2 -C /opt/maelstrom --strip-components=1
          sudo rm /tmp/maelstrom.tar.bz2
          echo "/opt/maelstrom" >> "$GITHUB_PATH"

      - name: Run Maelstrom unique-ids test
        run: |
          maelstrom test \
            -w unique-ids \
            --bin "src/main.py" \
            --time-limit 30 \
            --rate 1000 \
            --node-count 3 \
            --availability total \
            --nemesis partition \
            --log-stderr
        working-directory: ${{ github.workspace }}


  maelstrom-broadcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip
          pip install --group test

      - name: Set up Java 17 (for Maelstrom)
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install gnuplot (Maelstrom needs it for plots)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnuplot

      - name: Install Maelstrom v0.2.4
        run: |
          sudo mkdir -p /opt/maelstrom
          sudo curl -fL -o /tmp/maelstrom.tar.bz2 \
            https://github.com/jepsen-io/maelstrom/releases/download/v0.2.4/maelstrom.tar.bz2
          sudo tar -xjf /tmp/maelstrom.tar.bz2 -C /opt/maelstrom --strip-components=1
          sudo rm /tmp/maelstrom.tar.bz2
          echo "/opt/maelstrom" >> "$GITHUB_PATH"

      - name: Run Maelstrom broadcast test (challenge 3a)
        run: |
          maelstrom test \
            -w broadcast \
            --bin "src/main.py" \
            --node-count 1 \
            --time-limit 20 \
            --rate 10 \
            --log-stderr
        working-directory: ${{ github.workspace }}
