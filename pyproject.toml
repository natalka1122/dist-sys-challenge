[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "dist-sys-challenge"
version = "0.1.0"
description = "Solution to the Fly.io Distributed Systems Challenge (Maelstrom)"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
  {name = "natalka1122"},
]

dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
namespaces = false

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.mypy]
python_version = "3.14"
strict = true
check_untyped_defs = true
follow_untyped_imports = true
mypy_path = ["src"]
# Build caches live in /tmp so they never pollute the repo tree.
cache_dir = "/tmp/dist-sys-challenge-mypy-cache"

[tool.importlinter]
root_packages = ["handlers", "messages"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Layer boundaries: handlers above messages"
type = "layers"
layers = ["handlers", "messages"]

[[tool.importlinter.contracts]]
name = "Handlers are independent of each other"
type = "forbidden"
source_modules = ["handlers"]
forbidden_modules = ["handlers"]

[tool.coverage.run]
# Externalized so it never spoils the repo tree.
data_file = "/tmp/dist-sys-challenge.coverage"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
# Keep .pytest_cache out of the repo tree.
cache_dir = "/tmp/dist-sys-challenge-pytest-cache"
[dependency-groups]
lint = [
  "black",
  "cohesion",
  "dlint",
  "flake8",
  "import-linter",
  "mypy",
  "vulture",
  "wemake-python-styleguide",
]
test = ["pytest", "pytest-asyncio", "pytest-cov"]
dev = [
  {"include-group" = "lint"},
  {"include-group" = "test"},
  "pre-commit",
]
